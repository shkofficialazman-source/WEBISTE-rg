<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="speedSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="120" fill="url(#redGradient)" />
  
  <!-- Subtle Racing Speed Stripes / Diagonal Grid Texture -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="24" stroke-linecap="round">
    <line x1="-50" y1="120" x2="200" y2="-50" />
    <line x1="50" y1="280" x2="350" y2="-20" />
    <line x1="180" y1="460" x2="520" y2="120" />
    <line x1="320" y1="580" x2="600" y2="300" />
  </g>

  <!-- Sleek Top Reflection Sheen -->
  <path d="M 0 120 C 0 53.7 53.7 0 120 0 L 392 0 C 458.3 0 512 53.7 512 120 L 512 210 Q 256 260 0 210 Z" fill="url(#speedSheen)" />

  <!-- Speed Dash lines on left -->
  <rect x="32" y="246" width="38" height="18" rx="9" fill="#ffffff" opacity="0.9" />
  <rect x="20" y="278" width="50" height="18" rx="9" fill="#ffffff" opacity="0.9" />

  <!-- Dynamic Supercar Silhouette Accent in Background -->
  <path
    d="M 80 340 Q 140 320 220 300 L 300 200 Q 360 140 430 140 L 460 148 Q 490 160 500 200"
    stroke="#ffffff"
    stroke-width="12"
    stroke-linecap="round"
    opacity="0.25"
  />

  <!-- RG Bold Italic Monogram -->
  <g filter="url(#dropShadow)">
    <text 
      x="272" 
      y="355" 
      font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="900" 
      font-style="italic" 
      font-size="280" 
      letter-spacing="-16" 
      text-anchor="middle" 
      fill="#ffffff"
    >RG</text>
  </g>

  <!-- Modern Accent Dot at bottom-right -->
  <circle cx="440" cy="440" r="18" fill="#09090b" stroke="#ffffff" stroke-width="4" />
</svg>
