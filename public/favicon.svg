<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Dark Premium Container with subtle rounded border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" stroke="#27272a" stroke-width="4" />

  <!-- Speed Mesh -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <line x1="-50" y1="120" x2="200" y2="-50" />
    <line x1="50" y1="280" x2="350" y2="-20" />
    <line x1="180" y1="460" x2="520" y2="120" />
  </g>

  <!-- Supercar Outline Silhouette -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 180 160 Q 280 156 360 174 Q 410 188 440 206 L 470 240" stroke-width="10" />
    <path d="M 470 240 C 484 260 488 290 488 330" stroke-width="10" />
    <path d="M 460 220 Q 420 220 370 236 Q 340 248 352 256 Q 390 252 430 236 Z" stroke-width="8" fill="#ffffff" fill-opacity="0.15" />
    <path d="M 430 244 Q 380 258 356 272 Q 342 284 362 288 Q 400 280 436 260" stroke-width="7" />
    <path d="M 120 340 L 484 340" stroke-width="10" />
  </g>

  <!-- Speed lines -->
  <path d="M 40 280 L 140 280" stroke="url(#redGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 80 310 L 220 310" stroke="url(#redGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- RG Monogram in Racing Red -->
  <text 
    x="220" 
    y="315" 
    font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-style="italic" 
    font-size="190" 
    letter-spacing="-10" 
    text-anchor="middle" 
    fill="url(#redGrad)"
  >
    RG
  </text>
</svg>
