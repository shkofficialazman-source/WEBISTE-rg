<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" fill="none">
  <defs>
    <linearGradient id="redlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Speed line above REDLINE -->
  <path d="M 268 36 L 235 36" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Middle speed divider line from car nose across REDLINE & GARAGE -->
  <path d="M 345 56 C 315 56 290 56 240 56 L 210 56" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Ground splitter line running from car base all the way under GARAGE -->
  <path d="M 400 95 L 218 95" stroke="#18181b" stroke-width="2.8" stroke-linecap="round" />

  <!-- Typography Block: Left Side -->
  <g transform="translate(10, 12)">
    <!-- REDLINE: Bold, Slanted, Racing Red -->
    <text
      x="0"
      y="44"
      font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="40"
      letter-spacing="-0.04em"
      fill="url(#redlineGrad)"
    >
      REDLINE
    </text>

    <!-- GARAGE: Crisp, High-Tracking Bold Charcoal -->
    <text
      x="4"
      y="70"
      font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="800"
      font-size="17"
      letter-spacing="0.45em"
      fill="#18181b"
    >
      GARAGE
    </text>
  </g>

  <!-- Supercar Front Quarter Vector Silhouette: Right Side -->
  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Aerodynamic Roofline & Windshield -->
    <path
      d="M 276 35 Q 315 34 344 40 Q 364 45 382 50 L 398 64"
      stroke-width="3"
    />
    
    <!-- Secondary inner roofline contour -->
    <path
      d="M 288 38 Q 324 38 352 43 Q 370 48 386 54"
      stroke-width="1.8"
      opacity="0.85"
    />

    <!-- Side Mirror -->
    <path
      d="M 366 46 C 372 46 380 43 388 47 C 384 50 376 51 370 50 Z"
      fill="#18181b"
      stroke-width="1.2"
    />

    <!-- A-Pillar and Side Door Contour -->
    <path
      d="M 398 64 C 404 71 405 84 405 97"
      stroke-width="3"
    />

    <!-- Sleek Top Headlight Lens Outline -->
    <path
      d="M 394 58 Q 378 58 356 64 Q 340 69 346 72 Q 364 71 382 65 Q 391 61 394 58 Z"
      stroke-width="2.5"
      fill="#18181b"
      fill-opacity="0.08"
    />

    <!-- Lower Headlamp / Daytime Running Light Curve -->
    <path
      d="M 380 67 Q 358 72 348 78 Q 342 83 350 85 Q 366 82 381 74"
      stroke-width="2.2"
    />

    <!-- Center Air Dam / Front Lip Arc -->
    <path
      d="M 318 90 Q 338 90 354 94 Q 370 96 386 90"
      stroke-width="2.5"
    />

    <!-- Bottom Ground Effect Splitter and Corner Wheel Arch Lip -->
    <path
      d="M 220 100 L 402 100 C 405 100 405 97 405 90"
      stroke-width="3"
    />
  </g>
</svg>
